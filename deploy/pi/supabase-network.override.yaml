services:
  kong:
    ports: !override
      - "127.0.0.1:8000:8000/tcp"
      - "127.0.0.1:8443:8443/tcp"
    networks:
      - default
      - teachnotes

  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432/tcp"
      - "127.0.0.1:6543:6543/tcp"

networks:
  teachnotes:
    external: true
    name: teachnotes
