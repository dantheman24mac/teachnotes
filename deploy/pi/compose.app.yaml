name: teachnotes

services:
  web:
    build:
      context: ../..
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        TEACHNOTES_ENVIRONMENT: production
        TEACHNOTES_RELEASE_SHA: ${TEACHNOTES_RELEASE_SHA:-}
    env_file:
      - app.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SUPABASE_INTERNAL_URL: http://kong:8000
      TEACHNOTES_RELEASE_SHA: ${TEACHNOTES_RELEASE_SHA:-}
      TEACHNOTES_ENVIRONMENT: production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - teachnotes
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  demo:
    build:
      context: ../..
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ""
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
        NEXT_PUBLIC_APP_URL: https://demo.teachnotes.fyi
        DEMO_MODE: "true"
        TEACHNOTES_ENVIRONMENT: demo
        TEACHNOTES_RELEASE_SHA: ${TEACHNOTES_RELEASE_SHA:-}
    environment:
      DEMO_MODE: "true"
      TEACHNOTES_ENVIRONMENT: demo
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TEACHNOTES_RELEASE_SHA: ${TEACHNOTES_RELEASE_SHA:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - teachnotes-demo
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  cloudflared:
    container_name: teachnotes-cloudflared
    image: cloudflare/cloudflared:2026.7.1
    command: tunnel --no-autoupdate run
    env_file:
      - tunnel.env
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - teachnotes
      - teachnotes-demo
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  teachnotes:
    external: true
    name: teachnotes
  teachnotes-demo:
    external: true
    name: teachnotes-demo
